<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ✅ Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #f9f9f9;
      padding: 30px;
      text-align: center;
    }
    input {
      padding: 12px;
      width: 90%;
      max-width: 350px;
      margin: 10px auto;
      display: block;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background-color: teal;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    .eye-toggle {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .eye-toggle span {
      position: absolute;
      right: 30px;
      top: 13px;
      cursor: pointer;
      font-size: 18px;
    }
    .home-button {
      display: inline-block;
      margin-top: 20px;
      background-color: darkred;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>🔐 Login</h2>

  <input type="email" id="email" placeholder="Email" required />

  <div class="eye-toggle">
    <input type="password" id="password" placeholder="Password" required />
    <span onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="login()">Sign In</button>
  <p><a href="#" onclick="forgotPassword()">Forgot Password?</a></p>

  <p id="message" style="color: red; font-weight: bold;"></p>

  <a href="index.html" class="home-button">🔙 Back to Home</a>

  <!-- ✅ Firebase Setup and Script -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXjNG-i0NoXO5pqUpz8tj85GiCQE6muL8",
      authDomain: "myauthapp-71847.firebaseapp.com",
      projectId: "myauthapp-71847",
      storageBucket: "myauthapp-71847.firebasestorage.app",
      messagingSenderId: "200938214520",
      appId: "1:200938214520:web:aac9867cd3da4600d7098d",
      measurementId: "G-7FNHFLFK16"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("message").innerText = "✅ Login successful! Redirecting...";
          setTimeout(() => {
            window.location.href = "secret.html";
          }, 1000);
        })
        .catch((error) => {
          document.getElementById("message").innerText = "❗ " + error.message;
        });
    }

    function forgotPassword() {
      const email = document.getElementById("email").value;

      if (!email) {
        document.getElementById("message").innerText = "Please enter your email first.";
        return;
      }

      auth.sendPasswordResetEmail(email)
        .then(() => {
          document.getElementById("message").innerText = "📩 Reset link sent! Check your inbox (or spam).";
        })
        .catch((error) => {
          document.getElementById("message").innerText = "❗ " + error.message;
        });
    }
  </script>

</body>
</html>
